name: Idea or feature request
description: Suggest an improvement to one of the tools
labels: [enhancement]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options: [anime-restorer, movie-audio-merger, movie-concator, A new tool, The repository itself]
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: The problem you want to solve, and how you picture the change.
    validations:
      required: true
