name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options: [anime-restorer, movie-audio-merger, movie-concator]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead. Paste the console output.
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: About the input file
      description: Container, resolution, frame rate, audio and subtitle tracks (from ffprobe or mkvmerge -i). Please do not attach the video or frames from it.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Windows, Python, and FFmpeg / MKVToolNix / realesrgan-ncnn-vulkan as relevant.
      placeholder: Windows 11, Python 3.13, FFmpeg 7.1
